version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windlens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000
      - CACHE_TTL_SECONDS=1800
      - DEFAULT_DECISION_CUTOFF_TIME=11:00
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - windlens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windlens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - windlens-network

networks:
  windlens-network:
    driver: bridge
